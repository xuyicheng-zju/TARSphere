name: Website media

on:
  workflow_dispatch:
    inputs:
      transfer_release:
        description: Draft release containing media-parts.json and video parts
        required: true
        default: media-transfer-20261022

permissions:
  contents: read

concurrency:
  group: website-media
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TRANSFER_RELEASE: ${{ inputs.transfer_release }}
    steps:
      - name: Download the private transfer
        run: |
          test "$(gh release view "$TRANSFER_RELEASE" --json isDraft --jq .isDraft)" = true
          mkdir -p "$RUNNER_TEMP/media-parts" "$RUNNER_TEMP/media"
          gh release download "$TRANSFER_RELEASE" --dir "$RUNNER_TEMP/media-parts"
      - name: Reassemble, verify, and publish the original videos
        shell: python
        run: |
          from concurrent.futures import ThreadPoolExecutor
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          parts = Path(os.environ['RUNNER_TEMP']) / 'media-parts'
          destination = Path(os.environ['RUNNER_TEMP']) / 'media'
          entries = json.loads((parts / 'media-parts.json').read_text())['files']
          names = [entry['name'] for entry in entries]
          assert len(names) == len(set(names))
          for entry in entries:
              assert re.fullmatch(r'[A-Za-z0-9_.-]+\.mp4', entry['name'])
              digest = hashlib.sha256()
              output = destination / entry['name']
              with output.open('wb') as stream:
                  for part in entry['parts']:
                      assert re.fullmatch(r'media-\d+-\d+\.part', part['name'])
                      data = (parts / part['name']).read_bytes()
                      assert len(data) == part['bytes']
                      assert hashlib.sha256(data).hexdigest() == part['sha256']
                      stream.write(data)
                      digest.update(data)
              assert output.stat().st_size == entry['bytes']
              assert digest.hexdigest() == entry['sha256']
              print('Verified original:', entry['name'], flush=True)

          def upload(entry):
              subprocess.run(['gh', 'release', 'upload', 'media-v1',
                              str(destination / entry['name']), '--clobber'], check=True)
              print('Published:', entry['name'], flush=True)

          with ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(upload, entries))
          release = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/{os.environ["GH_REPO"]}/releases/tags/media-v1']))
          assets = {asset['name']: asset for asset in release['assets']}
          for entry in entries:
              asset = assets[entry['name']]
              assert asset['state'] == 'uploaded'
              assert asset['size'] == entry['bytes']
              assert asset['digest'] == 'sha256:' + entry['sha256']
          print('All published videos match their original SHA-256 digests.')
      - name: Remove the completed private transfer
        run: gh release delete "$TRANSFER_RELEASE" --yes
